name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Init Flutter Project
        run: |
          flutter create --platforms=android --project-name sonora --no-pub .
          rm -rf test/

      - name: Create Core Folders
        run: |
          mkdir -p lib/core/models lib/core/constants lib/screens lib/services/player
          
      - name: Create Core Files
        run: |
          cat > lib/core/constants/app_colors.dart << 'EOF'
          import 'package:flutter/material.dart';
          class AppColors {
            static const background = Color(0xFF121212);
            static const accent = Color(0xFF1DB954);
          }
          EOF
          
          cat > lib/core/models/track.dart << 'EOF'
          class Track {
            final String id, title, artist, source;
            const Track({required this.id, required this.title, required this.artist, required this.source});
          }
          EOF
          
          cat > lib/services/player/player_service.dart << 'EOF'
          import 'package:just_audio/just_audio.dart';
          class PlayerService {
            final AudioPlayer player = AudioPlayer();
            Future<void> playUrl(String url) async { await player.setUrl(url); player.play(); }
          }
          EOF
          
          cat > lib/screens/home_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});
            @override
            Widget build(BuildContext context) => Scaffold(
              backgroundColor: const Color(0xFF121212),
              body: const Center(child: Text('Sonora Core Ready', style: TextStyle(color: Colors.white))),
            );
          }
          EOF
          
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'screens/home_screen.dart';
          void main() => runApp(const MaterialApp(
            debugShowCheckedModeBanner: false,
            home: HomeScreen(),
          ));
          EOF

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk